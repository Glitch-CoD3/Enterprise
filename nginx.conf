server {
    listen 8080;
    server_name localhost;

    location = /portfolio {
        return 301 /portfolio/;
    }

    location /portfolio/ {
        proxy_pass http://portfolio:5173;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://store:5173;
        include /etc/nginx/proxy_params.conf;
    }
}